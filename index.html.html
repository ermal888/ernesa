<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For you ♥</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#1b0b2e}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const FPS=24,SPIN=0.6,TILT=0.30,CAM=4.0,MESSAGE="for you ♥",SIGN="Per Ernesen",NUM_HEARTS=18,PIVOT_Y=0.2;
const WHITE=[244,248,251,254,255,231],PINK=[125,162,168,205,211,218,225],RED=[52,88,124,160,196,203],
PURPLE=[54,91,97,134,140,183],YELLOW=[136,178,214,220,226,229],ORANGE=[130,166,202,208,214,216],
GOLD=[94,136,178,214,220],DARK=[52,58,94,130,136],GREENS=[22,28,28,34,35,71,77,114],
PAPER=[101,144,187,223,230,231],RIBBON=[88,125,161,197,204,211],HC=[161,197,204,205,211,218],
MC=[161,168,205,211,218,225,218,211,205,168],SHADE=".:-=+*%@",PS="+*#%";
const L0=[-0.45,0.6,0.66],ln=Math.hypot(...L0),[LX,LY,LZ]=L0.map(v=>v/ln);
const DISC=[[WHITE,GOLD,13],[PINK,GOLD,8],[RED,DARK,6],[PURPLE,GOLD,7],[YELLOW,DARK,12],[ORANGE,DARK,9]];
const TULIPS=[RED,PINK,YELLOW];
function mk(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mk(21),U=(a,b)=>a+(b-a)*R();
const norm=v=>{const m=Math.hypot(...v)||1;return[v[0]/m,v[1]/m,v[2]/m]};
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const add=(p,d,k)=>[p[0]+d[0]*k,p[1]+d[1]*k,p[2]+d[2]*k];
function hex(n){const v=[0,95,135,175,215,255];if(n>=232){const g=8+(n-232)*10;return`rgb(${g},${g},${g})`}
n-=16;return`rgb(${v[Math.floor(n/36)]},${v[Math.floor(n/6)%6]},${v[n%6]})`}
const HEX={};const hx=n=>HEX[n]||(HEX[n]=hex(n));

function build(){
const pts=[],neck=[0,-0.12,0],C=[0,0.12,0],D=0.68,N=14,golden=Math.PI*(3-Math.sqrt(5)),heads=[];
for(let i=0;i<N;i++){const el=(88-60*Math.sqrt(i/(N-1)))*Math.PI/180,az=i*golden;
const d=[Math.cos(el)*Math.cos(az),Math.sin(el),Math.cos(el)*Math.sin(az)];
heads.push([add(C,d,D*U(0.92,1.05)),norm(d)])}
const flowers=[];let di=0,nt=0;
heads.forEach(([pos,axis],idx)=>{
const base=add(pos,axis,-0.03);
for(let j=0;j<70;j++){const t=j/69;
pts.push([base[0]+(neck[0]-base[0])*t,base[1]+(neck[1]-base[1])*t,base[2]+(neck[2]-base[2])*t,axis[0],0,axis[2],GREENS,-0.15,true,null])}
if(idx==3||idx==8||idx==12){flowers.push([pos,"tulip",TULIPS[nt%3],null,0,0.11,U(0,6.28)]);nt++}
else{const[p,c,n]=DISC[di%6];di++;flowers.push([pos,"disc",p,c,n,U(0.13,0.16),U(0,6.28)])}
});
for(let i=0;i<8;i++){const a=(i+0.4)/8*2*Math.PI,c=Math.cos(a),s=Math.sin(a),base=[0.26*c,0.30,0.26*s],
d=norm([c,0.15,s]),side=[-s,0,c],n=norm(cross(side,d)),L=0.30,W=0.07;
for(let ti=0;ti<32;ti++){const t=ti/31;for(let wi=-5;wi<=5;wi++){const w=wi/5,curl=0.025*w*w,sw=W*Math.sin(Math.PI*t)*w;
pts.push([base[0]+d[0]*L*t+side[0]*sw+n[0]*curl,base[1]+d[1]*L*t-0.10*t*t+n[1]*curl,base[2]+d[2]*L*t+side[2]*sw+n[2]*curl,
n[0],n[1],n[2],GREENS,wi==0?-0.25:0,true,null])}}}
const y0=-0.20,y1=0.30,r0=0.06,r1=0.36,k=(r1-r0)/(y1-y0);
for(let i=0;i<50;i++){const t=i/49,r=r0+(r1-r0)*t,cnt=Math.max(8,Math.trunc(170*r));
for(let j=0;j<cnt;j++){const ph=(j+R())/cnt*2*Math.PI,c=Math.cos(ph),s=Math.sin(ph);let y=y0+(y1-y0)*t;
if(t>0.9)y+=0.03*Math.sin(9*ph);const fold=0.3*(Math.abs(Math.sin(5*ph))-0.6),nn=norm([c,-k,s]);
pts.push([r*c,y,r*s,nn[0],nn[1],nn[2],PAPER,fold,false,null])}}
for(let i=0;i<7;i++){const a=i/7*2*Math.PI,sx=0.025*Math.cos(a),sz=0.025*Math.sin(a);
for(let j=0;j<40;j++){const t=j/39;pts.push([sx*(1+1.2*t),-0.20-0.30*t,sz*(1+1.2*t),Math.cos(a),0,Math.sin(a),GREENS,-0.1,true,null])}}
const by=-0.12,br=r0+k*(by-y0)+0.01;
for(let j=0;j<90;j++){const ph=j/90*2*Math.PI;for(const dy of[-0.012,0,0.012])
pts.push([br*Math.cos(ph),by+dy,br*Math.sin(ph),Math.cos(ph),0,Math.sin(ph),RIBBON,0,false,null])}
const kn=[0,by,br+0.01];
for(const side of[-1,1]){
for(let j=0;j<70;j++){const a=j/70*2*Math.PI,lx=side*(0.07+0.07*Math.cos(a)),ly=0.04*Math.sin(a)+0.02*(0.07+0.07*Math.cos(a))/0.14;
for(const f of[1,0.7])pts.push([kn[0]+lx*f,kn[1]+ly*f,kn[2]+0.01,side*0.3,0.2,0.93,RIBBON,0.1,true,null])}
for(let j=0;j<30;j++){const t=j/29;pts.push([kn[0]+side*0.06*t,kn[1]-0.15*t,kn[2]+0.015,side*0.2,0,0.98,RIBBON,-0.05+0.05*Math.sin(t*9),true,null])}}
for(const dx of[-0.01,0,0.01])pts.push([dx,by,kn[2]+0.02,0,0,1,RIBBON,0.2,true,"@"]);
const babies=[];for(let i=0;i<90;i++){const a=R()*2*Math.PI,el=U(0.3,1.4),rr=U(0.40,0.58);
babies.push([rr*Math.cos(a)*Math.cos(el),C[1]+rr*Math.sin(el),rr*Math.sin(a)*Math.cos(el),U(0,6.28)])}
const sparkles=[];for(let i=0;i<30;i++){const a=R()*2*Math.PI,rr=U(0.75,0.95);
sparkles.push([rr*Math.cos(a),U(-0.3,1.0),rr*Math.sin(a),U(0,6.28),U(1.5,4.0)])}
return[pts,flowers,babies,sparkles]}

const scene=build(),hearts=[];
function updHearts(dt){
while(hearts.length<NUM_HEARTS)hearts.push([Math.random(),1+Math.random(),0.03+Math.random()*0.05,Math.random()*6.28,HC[Math.floor(Math.random()*HC.length)]]);
for(const h of hearts){h[1]-=h[2]*dt;if(h[1]<0){h[0]=Math.random();h[1]=1;h[4]=HC[Math.floor(Math.random()*HC.length)]}}}

function render(t,cols,rows){
const[pts,flowers,babies,sparkles]=scene,chars=Array.from({length:rows},()=>Array(cols).fill(" ")),
colors=Array.from({length:rows},()=>Array(cols).fill(0)),zb=Array.from({length:rows},()=>Array(cols).fill(-1e9));
const vr=rows-2,scale=Math.max(1,Math.min((vr-2)/1.45,(cols-2)/2.7)),sxs=scale*2,cx=cols/2,cy=1+0.78*scale,
ang=t*SPIN,ca=Math.cos(ang),sa=Math.sin(ang),ct=Math.cos(TILT),st=Math.sin(TILT);
const pf=(x,y,z)=>{const xr=x*ca-z*sa,zr=x*sa+z*ca,yp=y-PIVOT_Y,yt=yp*ct-zr*st,zt=yp*st+zr*ct,f=CAM/(CAM-zt);
return[cx+xr*f*sxs,cy-yt*f*scale,zt,f]};
const pj=(x,y,z)=>{const[a,b,c]=pf(x,y,z);return[Math.trunc(a),Math.trunc(b),c]};
const plot=(c,r,z,ch,col)=>{if(r>=0&&r<vr&&c>=0&&c<cols&&z>zb[r][c]){zb[r][c]=z;chars[r][c]=ch;colors[r][c]=col}};
const cl=b=>Math.min(0.999,Math.max(0,b));
for(const[x,y,,ph,col]of hearts){const c=((Math.trunc((x+0.015*Math.sin(t*1.2+ph))*cols)%cols)+cols)%cols;plot(c,Math.trunc(y*vr),-50,"♥",col)}
for(const[x,y,z,nx,ny,nz,pal,tone,two,ov]of pts){
const[c,r,zt]=pj(x,y,z),nxr=nx*ca-nz*sa,nzr=nx*sa+nz*ca,nyt=ny*ct-nzr*st,nzt=ny*st+nzr*ct;
let dot=nxr*LX+nyt*LY+nzt*LZ;if(two&&dot<0)dot=-dot*0.55;
const b=cl(0.25+0.75*Math.max(0,dot)+tone);
plot(c,r,zt,ov||SHADE[Math.trunc(b*SHADE.length)],pal[Math.trunc(b*pal.length)])}
for(const[[x,y,z],kind,pal,cpal,np,Rr,seed]of flowers){
const[fx,fy,zt,f]=pf(x,y,z),rx=Rr*f*sxs,ry=Rr*f*scale,dim=-0.4*(1-Math.min(1,Math.max(0,(zt+0.6)/1.2))),rot=seed+ang*0.7;
for(let row=Math.trunc(fy-ry)-1;row<Math.trunc(fy+ry)+2;row++){const dy=(row+0.5-fy)/ry;
for(let col=Math.trunc(fx-rx)-1;col<Math.trunc(fx+rx)+2;col++){const dx=(col+0.5-fx)/rx;
if(kind=="disc"){const s=Math.hypot(dx,dy);if(s>1)continue;
if(s<0.3){const b=cl(0.55-0.35*dx-0.35*dy+dim);plot(col,row,zt+0.06,s<0.17?"@":"o",cpal[Math.trunc(b*cpal.length)]);continue}
const ph=Math.atan2(dy,dx),reach=0.32+0.68*Math.abs(Math.cos(np*(ph+rot)/2))**0.7;if(s>reach)continue;
const edge=s>reach-0.14?-0.22:0,b=cl(0.5-0.22*dx-0.28*dy+0.3*s+0.1*Math.cos(np*(ph+rot))+edge+dim);
plot(col,row,zt+0.04*(1-s),PS[Math.trunc(b*4)],pal[Math.trunc(b*pal.length)])}
else{const v=(1-dy)/2;if(v<0||v>1)continue;const hw=0.62*Math.sin(Math.PI*0.5*Math.min(1,v*1.5+0.05));
if(hw<=0||Math.abs(dx)>hw)continue;const xn=dx/hw;if(v>0.72+0.28*Math.cos(1.5*Math.PI*xn)**2)continue;
const seam=Math.abs(Math.abs(xn)-0.33)<0.12&&v>0.3?-0.25:0,b=cl(0.55-0.3*xn+0.1*v+seam+dim);
plot(col,row,zt+0.03,PS[Math.trunc(b*4)],pal[Math.trunc(b*pal.length)])}}}}
for(const[x,y,z,ph]of babies){const[c,r,zt]=pj(x,y,z),s=Math.sin(t*2+ph)>0.6;plot(c,r,zt+0.02,s?"*":"·",s?231:255)}
for(const[x,y,z,ph,sp]of sparkles){const[c,r,zt]=pj(x,y,z),tw=Math.sin(t*sp+ph);
if(tw>0.85)plot(c,r,zt,"*",231);else if(tw>0.4)plot(c,r,zt,"+",225);else if(tw>0)plot(c,r,zt,"·",218)}
return[chars,colors]}

const cv=document.getElementById("c"),ctx=cv.getContext("2d");
let W,H,cw,chh,cols,rows,fs,dpr,bs,ta,gf,bg;
function resize(){dpr=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;
bs=Math.min(W*0.11,60);ta=bs*2.8;const gh=H-ta;fs=Math.max(7,Math.min(W/100/0.6,gh/44/2/0.6));ctx.setTransform(dpr,0,0,dpr,0,0);
gf="bold "+fs+"px ui-monospace,Menlo,Consolas,monospace";ctx.font=gf;
cw=ctx.measureText("M").width;chh=cw*2;cols=Math.max(20,Math.floor(W/cw));rows=Math.max(12,Math.floor(gh/chh))+2;
const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#1a0a3d");g.addColorStop(0.55,"#3d0f4a");g.addColorStop(1,"#14071f");
const g2=ctx.createRadialGradient(W/2,gh*0.45,0,W/2,gh*0.45,Math.max(W,H)*0.6);g2.addColorStop(0,"rgba(255,105,180,.30)");g2.addColorStop(1,"rgba(255,105,180,0)");
bg=[g,g2]}
addEventListener("resize",resize);resize();
let t0=performance.now(),last=t0;
function frame(now){requestAnimationFrame(frame);if(now-last<1000/FPS-2)return;const dt=(now-last)/1000;last=now;
updHearts(Math.min(dt,0.1));const[chars,colors]=render((now-t0)/1000,cols,rows);
ctx.fillStyle=bg[0];ctx.fillRect(0,0,W,H);ctx.fillStyle=bg[1];ctx.fillRect(0,0,W,H);
ctx.font=gf;ctx.textAlign="center";ctx.textBaseline="middle";ctx.shadowBlur=0;const ox=(W-cols*cw)/2;
for(let r=0;r<rows-2;r++)for(let c=0;c<cols;c++){const ch=chars[r][c];if(ch!==" "){ctx.fillStyle=hx(colors[r][c]);ctx.fillText(ch,ox+(c+0.5)*cw,(r+0.5)*chh)}}
const tt=(now-t0)/1000,sh=Math.trunc(tt*6);ctx.textAlign="left";ctx.shadowColor="rgba(255,105,180,.8)";ctx.shadowBlur=16;
ctx.font="bold "+bs+"px Georgia,serif";let x=(W-ctx.measureText(MESSAGE).width)/2;
[...MESSAGE].forEach((ch,i)=>{ctx.fillStyle=hx(MC[(i+sh)%MC.length]);ctx.fillText(ch,x,H-ta+bs*0.9);x+=ctx.measureText(ch).width});
ctx.font="italic "+bs*0.8+"px Georgia,serif";ctx.fillStyle="#ffd6ec";ctx.fillText(SIGN,(W-ctx.measureText(SIGN).width)/2,H-ta+bs*2.1);ctx.shadowBlur=0}
requestAnimationFrame(frame);
</script>
</body>
</html>
